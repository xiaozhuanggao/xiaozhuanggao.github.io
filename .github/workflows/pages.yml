name: Deploy Hexo site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate static files
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Download Baidu push state
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: baidu-push-state
          path: .baidu-state

      - name: Push to Baidu (轮转扫描旧文 + 新文, 百度主动推送)
        if: ${{ secrets.BAIDU_PUSH_TOKEN != '' }}
        continue-on-error: true
        env:
          BAIDU_PUSH_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}
        run: |
          python3 scripts/baidu_push.py \
            --sitemap public/sitemap.xml \
            --state .baidu-state/state.json \
            --site https://gaoxiaozhuang.me \
            --token "$BAIDU_PUSH_TOKEN" \
            --quota 10

      - name: Upload Baidu push state
        if: ${{ secrets.BAIDU_PUSH_TOKEN != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: baidu-push-state
          path: .baidu-state/state.json
          retention-days: 90
