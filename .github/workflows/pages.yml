name: Deploy Hexo site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy-sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate static files
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Push to Gitee (国内镜像)
        # Gitee 同步失败不阻断 GitHub Pages 部署；配好密钥后重跑即生效
        continue-on-error: true
        env:
          GITEE_SSH_KEY: ${{ secrets.GITEE_SSH_KEY }}
        run: |
          if [ -z "$GITEE_SSH_KEY" ]; then
            echo "::warning::未配置 secrets.GITEE_SSH_KEY，跳过 Gitee 同步。请在仓库 Settings → Secrets 添加后重跑。"
            exit 0
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$GITEE_SSH_KEY" > ~/.ssh/id_gitee
          chmod 600 ~/.ssh/id_gitee
          ssh-keyscan -t rsa,ed25519 gitee.com >> ~/.ssh/known_hosts 2>/dev/null
          cd public
          git init -q -b master
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "sync: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git remote add gitee git@gitee.com:gaoxiaozhuang/gaoxiaozhuang.git
          git push -f gitee master
