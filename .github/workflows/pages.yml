name: Deploy Hexo site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate static files
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Push new URLs to Baidu (百度主动推送)
        if: ${{ secrets.BAIDU_PUSH_TOKEN != '' }}
        continue-on-error: true
        run: |
          python3 scripts/baidu_push.py
          curl -sS -H 'Content-Type:text/plain' --data-binary @baidu_urls.txt \
            "http://data.zz.baidu.com/urls?site=https://gaoxiaozhuang.me&token=${{ secrets.BAIDU_PUSH_TOKEN }}"
